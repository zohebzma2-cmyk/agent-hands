[project]
name = "agent-hands"
version = "0.1.0"
description = "Record-once, replay-many computer use for legacy back-office UIs (interface.ai take-home)"
authors = [
    { name = "Zoheb", email = "zohebzma@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
hands = "agent_hands.cli:main"

[tool.uv.build-backend]
module-name = ["agent_hands", "cu_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs the real Anthropic API (key from Keychain); skipped by default",
    "browser: drives Chromium against the local target app",
]
addopts = "-m 'not live'"
