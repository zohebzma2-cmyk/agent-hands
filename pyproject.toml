[project]
name = "agent-hands"
version = "0.1.0"
description = "Record-once, replay-many computer use for legacy back-office UIs (interface.ai take-home)"
authors = [
    { name = "Zoheb Alvi", email = "zohebzma@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
hands = "agent_hands.cli:main"

[tool.uv.build-backend]
module-name = ["agent_hands", "cu_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: drives Chromium against the local target app",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# long lines here are inside embedded JavaScript or HTML string literals
"src/agent_hands/handoff/operator.py" = ["E501"]
"src/agent_hands/surface/describe.py" = ["E501"]
"src/agent_hands/surface/locate.py" = ["E501"]
"src/cu_sim/app.py" = ["E501"]
